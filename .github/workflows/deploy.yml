name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_ENV: production
  IMAGE_TAG_SSM_PARAM: /main-website/IMAGE_TAG
  ASG_NAME: Web_Alb

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_API_DEV=${{ secrets.NEXT_PUBLIC_API_DEV }}
            NEXT_PUBLIC_API_PROD=${{ secrets.NEXT_PUBLIC_API_PROD }}
            NEXT_PUBLIC_MTO_API_BASE=${{ secrets.NEXT_PUBLIC_MTO_API_BASE }}
            NEXT_PUBLIC_KWIKPASS_MERCHANT_ID=${{ secrets.NEXT_PUBLIC_KWIKPASS_MERCHANT_ID }}
            NEXT_PUBLIC_KWIKPASS_ENVIRONMENT=${{ secrets.NEXT_PUBLIC_KWIKPASS_ENVIRONMENT }}
            NEXT_PUBLIC_KP_BASE=${{ secrets.NEXT_PUBLIC_KP_BASE }}
            NEXT_PUBLIC_KWIKPASS_SHOP_DOMAIN=${{ secrets.NEXT_PUBLIC_KWIKPASS_SHOP_DOMAIN }}
            NEXT_PUBLIC_OMS_API_URL=${{ secrets.NEXT_PUBLIC_OMS_API_URL }}
            NEXT_PUBLIC_GOKWIK_STORE_ID=${{ secrets.NEXT_PUBLIC_GOKWIK_STORE_ID }}
            NEXT_PUBLIC_GOKWIK_FB_PIXEL=${{ secrets.NEXT_PUBLIC_GOKWIK_FB_PIXEL }}
            NEXT_PUBLIC_ANALYTICS_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_META_PIXEL_ID }}
            NEXT_PUBLIC_ANALYTICS_GA4_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_GA4_MEASUREMENT_ID }}
            NEXT_PUBLIC_ANALYTICS_GOOGLE_ADS_CONVERSION_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_GOOGLE_ADS_CONVERSION_ID }}
            NEXT_PUBLIC_ANALYTICS_GOOGLE_ADS_PURCHASE_SEND_TO=${{ secrets.NEXT_PUBLIC_ANALYTICS_GOOGLE_ADS_PURCHASE_SEND_TO }}
            NEXT_PUBLIC_ANALYTICS_SIMPROSYS_GTM_CONTAINER_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_SIMPROSYS_GTM_CONTAINER_ID }}
            NEXT_PUBLIC_ANALYTICS_PINTEREST_TAG_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_PINTEREST_TAG_ID }}
            NEXT_PUBLIC_ANALYTICS_SPOTIFY_PIXEL_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_SPOTIFY_PIXEL_ID }}
            NEXT_PUBLIC_ANALYTICS_ADMITAD_CAMPAIGN_CODE=${{ secrets.NEXT_PUBLIC_ANALYTICS_ADMITAD_CAMPAIGN_CODE }}
            NEXT_PUBLIC_ANALYTICS_MIXPANEL_TOKEN=${{ secrets.NEXT_PUBLIC_ANALYTICS_MIXPANEL_TOKEN }}
            NEXT_PUBLIC_ANALYTICS_MIXPANEL_API_HOST=${{ secrets.NEXT_PUBLIC_ANALYTICS_MIXPANEL_API_HOST }}
            NEXT_PUBLIC_ANALYTICS_CLARITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_CLARITY_PROJECT_ID }}
            NEXT_PUBLIC_ANALYTICS_WEBENGAGE_LICENSE_CODE=${{ secrets.NEXT_PUBLIC_ANALYTICS_WEBENGAGE_LICENSE_CODE }}
            NEXT_PUBLIC_ANALYTICS_WEBENGAGE_DATA_CENTER=${{ secrets.NEXT_PUBLIC_ANALYTICS_WEBENGAGE_DATA_CENTER }}
            NEXT_PUBLIC_CAREERS_GENERAL_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_CAREERS_GENERAL_SCRIPT_URL }}
            NEXT_PUBLIC_CAREERS_JOB_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_CAREERS_JOB_SCRIPT_URL }}

      - name: Update SSM Parameter
        run: |
          aws ssm put-parameter \
            --name "${IMAGE_TAG_SSM_PARAM}" \
            --type String \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Start Auto Scaling Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${ASG_NAME}" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}'

      - name: Deployment Summary
        run: |
          echo "Deployment completed"
          echo ""
          echo "Image:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo ""
          echo "SSM Parameter:"
          echo "${IMAGE_TAG_SSM_PARAM} = ${IMAGE_TAG}"
          echo ""
          echo "Auto Scaling Group:"
          echo "${ASG_NAME}"